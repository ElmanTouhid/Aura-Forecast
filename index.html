<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aura Forecast: perfume suggestions matched to your weather.">
  <title>Aura Forecast</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="logo">Aura Forecast</a>
      <p class="tagline">Your scent, matched to the sky.</p>
    </div>
  </header>

  <main>

    <!-- Weather Hero -->
    <section id="weather" class="section weather">
      <div class="container">
        <form id="city-form" class="city-form">
          <input type="text" id="city-input" placeholder="Search a city..." autocomplete="off">
          <button type="submit" class="btn">Search</button>
        </form>

        <div id="weather-status" class="status"></div>

        <div id="weather-card" class="weather-card">
          <h2 id="weather-location">Chittagong</h2>
          <p id="weather-temp" class="weather-temp">--°C</p>
          <p id="weather-condition">--</p>
          <p id="weather-humidity">Humidity: --%</p>
          <p id="weather-season" class="season-badge">--</p>
        </div>
      </div>
    </section>

    <!-- Today's Aura -->
    <section id="aura" class="section">
      <div class="container">
        <h2 class="section-title">Today's Aura</h2>
        <p class="section-subtitle">Perfumes picked for the weather right now.</p>
        <div id="aura-status" class="status"></div>
        <div id="aura-grid" class="grid"></div>
      </div>
    </section>

    <!-- Explore -->
    <section id="explore" class="section">
      <div class="container">
        <h2 class="section-title">Explore</h2>

        <form id="search-form" class="search-form">
          <input type="text" id="search-input" placeholder="Search by name, note or house..." autocomplete="off">
          <button type="submit" class="btn">Search</button>
        </form>

        <div id="season-filters" class="filters">
          <button class="filter-btn active" data-season="all">All</button>
          <button class="filter-btn" data-season="spring">Spring</button>
          <button class="filter-btn" data-season="summer">Summer</button>
          <button class="filter-btn" data-season="autumn">Autumn</button>
          <button class="filter-btn" data-season="winter">Winter</button>
        </div>

        <div id="explore-status" class="status"></div>
        <div id="explore-grid" class="grid"></div>
      </div>
    </section>

    <!-- Favourites -->
    <section id="favourites" class="section">
      <div class="container">
        <h2 class="section-title">Your Favourites</h2>
        <div id="favourites-status" class="status"></div>
        <div id="favourites-grid" class="grid"></div>
      </div>
    </section>

  </main>

  <!-- Perfume Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__content">
      <button id="modal-close" class="modal__close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>Weather by Open-Meteo · Perfume data by Scento</p>
      <p>Built by Elman Touhid · CSE-2340, IIUC</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
