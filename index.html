<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Aura Forecast: perfume suggestions matched to your weather.">
  <title>Aura Forecast</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Background glow orbs (make the glass effect visible) -->
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb--1"></span>
    <span class="orb orb--2"></span>
    <span class="orb orb--3"></span>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="container header__inner">
      <a href="#" class="logo">Aura Forecast</a>
      <p class="tagline">
        <span class="tagline__left">Your scent,</span>
        <span class="tagline__right">matched to the sky.</span>
      </p>
    </div>
  </header>

  <main>

    <!-- Weather Hero -->
    <section id="weather" class="section weather">
      <div class="container">
        <form id="city-form" class="city-form glass-form">
          <input type="text" id="city-input" placeholder="Search a city..." autocomplete="off">
          <button type="submit" class="btn btn--glass">Search</button>
        </form>

        <div id="weather-status" class="status"></div>

        <div id="weather-card" class="weather-card glass">
          <!-- Mini animated weather scene -->
          <div id="weather-scene" class="weather-scene scene-clear" aria-hidden="true">
            <div class="sun"></div>

            <div class="cloud cloud--1"></div>
            <div class="cloud cloud--2"></div>

            <div class="rain">
              <span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
              <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span>
              <span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span>
              <span style="--i:10"></span><span style="--i:11"></span><span style="--i:12"></span>
            </div>

            <div class="snow">
              <span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span>
              <span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span>
              <span style="--i:7"></span><span style="--i:8"></span><span style="--i:9"></span>
              <span style="--i:10"></span>
            </div>

            <div class="bolt"></div>

            <div class="fog">
              <span></span><span></span><span></span>
            </div>

            <div class="person">
              <div class="umbrella"></div>
              <div class="umbrella-handle"></div>
              <div class="head"></div>
              <div class="body"></div>
            </div>
          </div>

          <!-- Weather details -->
          <div class="weather-info">
            <h2 id="weather-location">Chittagong</h2>
            <p id="weather-temp" class="weather-temp">--°C</p>
            <p id="weather-condition">--</p>
            <p id="weather-humidity">Humidity: --%</p>
            <p id="weather-season" class="season-badge">--</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Today's Aura -->
    <section id="aura" class="section aura" data-reveal>
      <div class="container">
        <h2 class="section-title aura-title">Today's Aura</h2>
        <p class="section-subtitle split-text">Perfumes picked for the weather right now.</p>
        <div id="aura-status" class="status"></div>
        <div id="aura-grid" class="grid wave-grid"></div>
      </div>
    </section>

    <!-- Explore -->
    <section id="explore" class="section explore" data-reveal>
      <div class="container">
        <h2 class="section-title split-text split-text--drop">Explore</h2>

        <form id="search-form" class="search-form glass-search">
          <input type="text" id="search-input" placeholder="Search by name, note or house..." autocomplete="off">
          <button type="submit" class="btn btn--glass">Search</button>
        </form>

        <div id="season-filters" class="filters">
          <button class="filter-btn active" data-season="all" style="--i:0">All</button>
          <button class="filter-btn" data-season="spring" style="--i:1">Spring</button>
          <button class="filter-btn" data-season="summer" style="--i:2">Summer</button>
          <button class="filter-btn" data-season="autumn" style="--i:3">Autumn</button>
          <button class="filter-btn" data-season="winter" style="--i:4">Winter</button>
        </div>

        <div id="explore-status" class="status"></div>
        <div id="explore-grid" class="grid wave-grid"></div>
      </div>
    </section>

    <!-- Favourites -->
    <section id="favourites" class="section">
      <div class="container">
        <h2 class="section-title">Your Favourites</h2>
        <div id="favourites-status" class="status"></div>
        <div id="favourites-grid" class="grid wave-grid"></div>
      </div>
    </section>

  </main>

  <!-- Perfume Pop-up -->
  <div id="modal" class="modal hidden">
    <div class="modal__overlay" id="modal-overlay"></div>
    <div class="modal__content glass">
      <button id="modal-close" class="modal__close" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <p>Weather by Open-Meteo · Perfume data by Scento</p>
      <p>Built by Elman Touhid</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
